<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/ui/shared.css" />
  <style>
    .set-password-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); padding: 24px; }
    .set-password-card { background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(37, 99, 235, 0.15); max-width: 500px; width: 100%; padding: 36px; border: 1px solid var(--gray-200); }
    .set-password-card h1 { font-size: 1.7rem; margin-bottom: 8px; }
    .set-password-card p { color: var(--gray-600); line-height: 1.6; }
    .helper { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 14px; font-size: 0.92rem; color: #1e40af; margin: 18px 0 22px; }
  </style>
</head>
<body>
  <div class="set-password-page">
    <div class="set-password-card">
      <div style="text-align:center;margin-bottom:24px;">
        <i class="fas fa-shield-heart" style="font-size:2.4rem;color:var(--primary);margin-bottom:10px;"></i>
        <h1>Application submitted</h1>
        <p>Your candidate account is ready. Set your password now to track this application.</p>
      </div>

      <div class="helper">
        Use this password next time you sign in to the candidate portal with the same email address.
      </div>

      <form id="setPasswordForm">
        <div class="form-group">
          <label>New Password <span class="required">*</span></label>
          <input type="password" id="newPassword" placeholder="Minimum 10 characters" minlength="10" required />
        </div>
        <div class="form-group">
          <label>Confirm Password <span class="required">*</span></label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="10" required />
        </div>
        <button type="submit" class="btn btn-primary w-full" id="setPasswordBtn">
          <i class="fas fa-lock" style="margin-right:6px;"></i> Save Password and Continue
        </button>
      </form>

      <div style="text-align:center;margin-top:16px;font-size:0.9rem;">
        <a href="#" id="skipLink">Skip for now</a>
        <span style="margin:0 8px;color:var(--gray-300);">•</span>
        <a href="#" id="logoutLink">Logout</a>
      </div>
    </div>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/');
    const oIndex = pathParts.indexOf('o');
    const orgSlug = oIndex !== -1 ? pathParts[oIndex + 1] : null;
    const next = new URLSearchParams(window.location.search).get('next') || (orgSlug ? `/portal/o/${orgSlug}/dashboard` : '/');
    const loginUrl = orgSlug ? `/portal/o/${orgSlug}/candidate-login?next=${encodeURIComponent(next)}` : '/';

    document.getElementById('skipLink').href = next;
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await fetch('/api/v1/public/logout', {
          method: 'POST',
          credentials: 'include'
        });
      } finally {
        window.location.href = orgSlug ? `/portal/o/${orgSlug}` : '/';
      }
    });

    async function ensureCandidateSession() {
      const res = await fetch('/api/v1/public/me', { credentials: 'include' });
      if (!res.ok) {
        window.location.href = loginUrl;
      }
    }

    document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alert('Passwords do not match.');
        return;
      }

      const btn = document.getElementById('setPasswordBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i> Saving...';

      try {
        const res = await fetch('/api/v1/public/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ new_password: newPassword })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || data.message || 'Unable to set password');
        window.location.href = next;
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-lock" style="margin-right:6px;"></i> Save Password and Continue';
      }
    });

    ensureCandidateSession();
  </script>
  <script src="/ui/shared/app.js"></script>
</body>
</html>
