<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/ui/shared.css" />
  <style>
    .candidate-login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); padding: 24px; }
    .candidate-login-card { background: #fff; border-radius: 18px; box-shadow: 0 24px 60px rgba(37, 99, 235, 0.15); max-width: 460px; width: 100%; padding: 36px; border: 1px solid var(--gray-200); }
    .candidate-login-card h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .candidate-login-card p { color: var(--gray-600); line-height: 1.6; }
    .candidate-login-card .helper { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 12px; padding: 14px; font-size: 0.9rem; color: var(--gray-600); margin: 18px 0 22px; }
  </style>
</head>
<body>
  <div class="candidate-login-page">
    <div class="candidate-login-card">
      <div style="text-align:center;margin-bottom:24px;">
        <i class="fas fa-user-check" style="font-size:2.4rem;color:var(--primary);margin-bottom:10px;"></i>
        <h1>Candidate Login</h1>
        <p>Sign in to track your applications, ATS scores, and hiring status.</p>
      </div>

      <div class="helper">
        Use the same email you applied with. If your account was created automatically and you do not know the password yet, use <strong>Forgot password</strong> to set one.
      </div>

      <form id="candidateLoginForm">
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" id="email" placeholder="candidate@example.com" required />
        </div>
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary w-full" id="loginBtn">
          <i class="fas fa-sign-in-alt" style="margin-right:6px;"></i> Sign In to Track Applications
        </button>
      </form>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:0.9rem;">
        <a href="#" id="forgotPasswordLink">Forgot password?</a>
        <a href="#" id="browseJobsLink">Browse jobs</a>
      </div>
    </div>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/');
    const oIndex = pathParts.indexOf('o');
    const orgSlug = oIndex !== -1 ? pathParts[oIndex + 1] : null;
    const next = new URLSearchParams(window.location.search).get('next') || (orgSlug ? `/portal/o/${orgSlug}/dashboard` : '/');

    if (orgSlug) {
      document.getElementById('browseJobsLink').href = `/portal/o/${orgSlug}`;
    }

    document.getElementById("candidateLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i> Signing in...';

      try {
        const res = await fetch('/api/v1/public/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || data.message || data.error_code || 'Candidate login failed');
        window.location.href = next;
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:6px;"></i> Sign In to Track Applications';
      }
    });

    document.getElementById("forgotPasswordLink").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value || prompt("Enter your application email:");
      if (!email) return;
      const res = await fetch('/api/v1/auth/password-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (res.ok) {
        alert('If that account exists, a reset link has been prepared.');
      } else {
        alert('Unable to start password reset.');
      }
    });
  </script>
  <script src="/ui/shared/app.js"></script>
</body>
</html>
