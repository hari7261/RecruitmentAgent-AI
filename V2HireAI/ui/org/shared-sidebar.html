<style>
  /* ──────────────────────────────────────────────────────────────
       Professional Sidebar
       ────────────────────────────────────────────────────────────── */
  :root {
    --sidebar-width: 260px;
    --sidebar-collapsed: 68px;
    --sidebar-bg: #0a0f1e;
    --sidebar-hover: rgba(255, 255, 255, 0.04);
    --sidebar-active: rgba(59, 130, 246, 0.12);
    --sidebar-border: rgba(255, 255, 255, 0.06);
    --text-primary: #e8edf5;
    --text-secondary: #8892a8;
    --text-muted: #4a5568;
    --accent: #3b82f6;
    --accent-dim: rgba(59, 130, 246, 0.15);
  }

  /* ─── Sidebar Overlay ─── */
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 998;
    display: none;
  }

  .sidebar-overlay.open {
    display: block;
  }

  /* ─── Sidebar ─── */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    z-index: 999;
    display: flex;
    flex-direction: column;
    transition: width 0.3s ease;
    overflow: hidden;
    border-right: 1px solid var(--sidebar-border);
  }

  /* ─── Header ─── */
  .sidebar-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--sidebar-border);
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    flex-shrink: 0;
  }

  .sidebar-header .logo-icon {
    width: 34px;
    height: 34px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: white;
    flex-shrink: 0;
  }

  .sidebar-header .brand-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.2px;
    white-space: nowrap;
  }

  .sidebar-header .brand-text span {
    color: var(--accent);
  }

  /* ─── Navigation ─── */
  .sidebar-nav {
    flex: 1;
    padding: 16px 12px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--sidebar-hover) transparent;
  }

  .sidebar-nav::-webkit-scrollbar {
    width: 3px;
  }

  .sidebar-nav::-webkit-scrollbar-thumb {
    background: var(--sidebar-hover);
    border-radius: 4px;
  }

  .sidebar-nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 6px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
    margin-bottom: 1px;
    position: relative;
  }

  .sidebar-nav a:hover {
    background: var(--sidebar-hover);
    color: var(--text-primary);
  }

  .sidebar-nav a.active {
    background: var(--sidebar-active);
    color: var(--accent);
  }

  .sidebar-nav a.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }

  .sidebar-nav a i {
    width: 18px;
    text-align: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .sidebar-nav a .nav-text {
    flex: 1;
    white-space: nowrap;
  }

  .sidebar-nav a .nav-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--sidebar-hover);
    padding: 0 8px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
    line-height: 18px;
  }

  .sidebar-nav a.active .nav-badge {
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* ─── Footer ─── */
  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--sidebar-border);
    flex-shrink: 0;
  }

  .sidebar-footer .user-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 6px;
    transition: background 0.15s ease;
  }

  .sidebar-footer .user-row:hover {
    background: var(--sidebar-hover);
  }

  .sidebar-footer .user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .sidebar-footer .user-info {
    flex: 1;
    min-width: 0;
  }

  .sidebar-footer .user-info .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-footer .user-info .email {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-footer .logout-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    transition: all 0.15s ease;
    font-size: 14px;
  }

  .sidebar-footer .logout-btn:hover {
    color: #ef4444;
    background: rgba(239, 68, 68, 0.08);
  }

  /* ─── Collapsed State ─── */
  @media (min-width: 769px) {
    .sidebar.collapsed {
      width: var(--sidebar-collapsed);
    }

    .sidebar.collapsed .brand-text,
    .sidebar.collapsed .nav-text,
    .sidebar.collapsed .nav-badge,
    .sidebar.collapsed .user-info,
    .sidebar.collapsed .logout-btn {
      display: none;
    }

    .sidebar.collapsed .sidebar-header {
      justify-content: center;
      padding: 16px 12px;
    }

    .sidebar.collapsed .sidebar-nav a {
      justify-content: center;
      padding: 10px;
    }

    .sidebar.collapsed .sidebar-nav a i {
      font-size: 17px;
    }

    .sidebar.collapsed .sidebar-footer .user-row {
      justify-content: center;
      padding: 4px;
    }

    .sidebar.collapsed .sidebar-footer .user-avatar {
      width: 32px;
      height: 32px;
      font-size: 13px;
    }

    /* Expand on hover */
    .sidebar.collapsed:hover {
      width: var(--sidebar-width);
    }

    .sidebar.collapsed:hover .brand-text,
    .sidebar.collapsed:hover .nav-text,
    .sidebar.collapsed:hover .nav-badge,
    .sidebar.collapsed:hover .user-info,
    .sidebar.collapsed:hover .logout-btn {
      display: inline;
    }

    .sidebar.collapsed:hover .sidebar-header {
      justify-content: flex-start;
      padding: 20px 20px 16px;
    }

    .sidebar.collapsed:hover .sidebar-nav a {
      justify-content: flex-start;
      padding: 9px 12px;
    }

    .sidebar.collapsed:hover .sidebar-footer .user-row {
      justify-content: flex-start;
      padding: 6px 8px;
    }
  }

  /* ─── Mobile ─── */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-overlay.open {
      display: block;
    }
  }

  /* ─── Toggle Button ─── */
  .sidebar-toggle {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--sidebar-bg);
    color: var(--text-secondary);
    border: 1px solid var(--sidebar-border);
    cursor: pointer;
    font-size: 14px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .sidebar-toggle:hover {
    background: var(--sidebar-hover);
    color: var(--text-primary);
  }

  @media (min-width: 769px) {
    .sidebar-toggle {
      display: flex;
    }
  }

  @media (max-width: 768px) {
    .sidebar-toggle {
      display: none;
    }
  }
</style>

<!-- ─── Sidebar HTML ─── -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <!-- Header -->
  <div class="sidebar-header">
    <div class="logo-icon">
      <i class="fas fa-rocket"></i>
    </div>
    <div class="brand-text">ATS<span>Workspace</span></div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <a href="/ui/org/dashboard.html">
      <i class="fas fa-chart-pie"></i>
      <span class="nav-text">Dashboard</span>
    </a>
    <a href="/ui/org/openings.html">
      <i class="fas fa-briefcase"></i>
      <span class="nav-text">Openings</span>
    </a>
    <a href="/ui/org/applications.html">
      <i class="fas fa-users"></i>
      <span class="nav-text">Applications</span>
    </a>
    <a href="/ui/org/team.html">
      <i class="fas fa-user-friends"></i>
      <span class="nav-text">Team</span>
    </a>
    <a href="/ui/org/settings.html">
      <i class="fas fa-cog"></i>
      <span class="nav-text">Settings</span>
    </a>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar" id="sidebarAvatar">U</div>
      <div class="user-info">
        <div class="name" id="sidebarName">Workspace User</div>
        <div class="email" id="sidebarEmail">Signed-in account</div>
      </div>
      <button class="logout-btn" onclick="logout()" title="Logout">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>
</aside>

<!-- ─── Toggle Button ─── -->
<button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
  <i class="fas fa-chevron-left"></i>
</button>

<script>
  // ─── Sidebar Functions ───

  function openSidebar() {
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
  }

  function closeSidebar() {
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (window.innerWidth <= 768) {
      sidebar.classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
      document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
    } else {
      sidebar.classList.toggle('collapsed');
      const icon = document.querySelector('.sidebar-toggle i');
      icon.className = sidebar.classList.contains('collapsed') ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
    }
  }

  // ─── Update User Info ───

  function updateSidebarUser(user) {
    if (!user) return;
    const avatar = document.getElementById('sidebarAvatar');
    const name = document.getElementById('sidebarName');
    const email = document.getElementById('sidebarEmail');

    if (avatar) avatar.textContent = (user.name || user.username || 'U')[0].toUpperCase();
    if (name) name.textContent = user.name || user.username || 'User';
    if (email) email.textContent = user.email || 'user@example.com';
  }

  // ─── Close on Escape ───
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSidebar();
  });

  // ─── Close on resize ───
  window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  // ─── Auto-active link ───
  document.addEventListener('DOMContentLoaded', () => {
    const path = window.location.pathname;
    document.querySelectorAll('.sidebar-nav a').forEach(link => {
      const href = link.getAttribute('href');
      if (href && path.includes(href.replace('/ui/org/', ''))) {
        link.classList.add('active');
      }
    });
  });
</script>
