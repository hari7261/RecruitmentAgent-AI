<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/ui/shared.css">
</head>
<body>
  <div class="sidebar-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><i class="fas fa-shield-alt" style="margin-right:8px;"></i> Platform Admin</div>
      <nav class="sidebar-nav">
        <a href="/ui/admin/index.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="/ui/admin/organizations.html"><i class="fas fa-building"></i> Organizations</a>
        <a href="/ui/admin/users.html" class="active"><i class="fas fa-users"></i> Users</a>
        <a href="/ui/admin/subscriptions.html"><i class="fas fa-credit-card"></i> Subscriptions</a>
        <a href="/ui/admin/settings.html"><i class="fas fa-cog"></i> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost" style="color:#fff;width:100%;justify-content:center;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="top-header">
        <div class="flex items-center gap-3">
          <button class="btn btn-ghost md:hidden" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
          <span class="page-title">Platform Users</span>
        </div>
      </header>
      <div class="page-body">
        <div class="card">
          <div class="card-body" style="padding:0;">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Organization</th><th>Status</th><th>Last Login</th></tr></thead>
                <tbody id="usersTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="/ui/shared/app.js"></script>
  <script>
    const roleBadge = r => ({ super_admin: "gray", org_admin: "warning", org_member: "info", candidate: "success" }[r] || "gray");

    async function loadUsers() {
      const user = await requireAuth(["super_admin"]);
      if (!user) return;
      try {
        const res = await fetchWithAuth("/api/v1/admin/tenants/users");
        if (res.ok) {
          const users = await res.json();
          document.getElementById("usersTable").innerHTML = users.map(u => `
            <tr>
              <td><strong>${escapeHtml(u.full_name || '—')}</strong></td>
              <td class="text-muted text-sm">${escapeHtml(u.email)}</td>
              <td><span class="badge ${roleBadge(u.role)}">${escapeHtml(u.role)}</span></td>
              <td class="text-sm">${escapeHtml(u.tenant_id || 'Platform')}</td>
              <td><span class="badge ${u.is_active ? 'success' : 'gray'}">${u.is_active ? 'active' : 'inactive'}</span></td>
              <td class="text-muted text-sm">${u.last_login_at ? new Date(u.last_login_at).toLocaleDateString() : '—'}</td>
            </tr>
          `).join("");
        }
      } catch (e) { console.error("Users load error:", e); }
    }

    loadUsers();
  </script>
</body>
</html>
